*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);color:var(--color-text-primary)}
.wrap{padding:1rem 0}

.area-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--border-radius-md);cursor:pointer;user-select:none}

.check{width:16px;height:16px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.done{background:#C0DD97;border:1.5px solid #639922}

.wip{background:#FAEEDA;border:1.5px solid #BA7517}

.file-info{flex:1;min-width:0}
.file-path{font-size:12px;font-family:var(--font-mono);color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-desc{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
.legend{display:flex;gap:16px;padding:0 2px 12px;font-size:11px;color:var(--color-text-secondary)}
.leg-item{display:flex;align-items:center;gap:5px}
.prog-bar{height:4px;border-radius:2px;background:var(--color-background-secondary);margin-top:6px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;background:#639922;transition:width .3s}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sum-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
.sum-val{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.sum-lbl{font-size:11px;color:var(--color-text-secondary);margin-top:2px}

function renderAreas() {
  const container = document.getElementById('areas');
  let totalDone=0, totalWip=0, totalTodo=0;
  
  data.forEach((area, ai) => {
    const done = area.files.filter(f=>f.s==='done').length;
    const wip = area.files.filter(f=>f.s==='wip').length;
    const total = area.files.length;
    totalDone += done; totalWip += wip; totalTodo += (total-done-wip);
    const pct = Math.round(((done + wip*0.5)/total)*100);
    
    const div = document.createElement('div');
    div.className='area';
    div.innerHTML = `
      <div class="area-header" style="background:${area.color};border:0.5px solid ${area.border}" onclick="toggle(${ai})">
        <div class="area-title" style="color:${area.text}">
          <svg width="12" height="12" viewBox="0 0 12 12" id="chevron-${ai}" style="transition:transform .2s;flex-shrink:0"><path d="M3 4.5L6 7.5L9 4.5" fill="none" stroke="${area.text}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          ${area.label}
        </div>
        <div class="area-progress" style="color:${area.text}">${done}/${total} done</div>
      </div>
      <div class="prog-bar" style="margin:4px 0 0"><div class="prog-fill" style="width:${pct}%;background:${area.border}"></div></div>
      <div class="files" id="files-${ai}">
        ${area.files.map(f=>`
          <div class="file-row">
            <div class="check ${f.s}">
              ${f.s==='done'?'<svg viewBox="0 0 10 10"><polyline points="2,5 4,7.5 8,3"/></svg>':f.s==='wip'?'<div class="wip-dot"></div>':''}
            </div>
            <div class="file-info">
              <div class="file-path">${f.path}</div>
              <div class="file-desc">${f.desc}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(div);
  });
  
  const grandTotal = totalDone+totalWip+totalTodo;
  document.getElementById('cnt-done').textContent = totalDone;
  document.getElementById('cnt-wip').textContent = totalWip;
  document.getElementById('cnt-todo').textContent = totalTodo;
  const overallPct = Math.round(((totalDone+totalWip*0.5)/grandTotal)*100);
  document.getElementById('overall-bar').style.width = overallPct+'%';
}

function toggle(ai) {
  const el = document.getElementById('files-'+ai);
  const ch = document.getElementById('chevron-'+ai);
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  ch.style.transform = open ? 'rotate(-90deg)' : '';
}

renderAreas();
